name: Contribution snake

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate the snake in the CK Works palette
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#1F2420&color_dots=#EFEADF,#CFE0CC,#9BB8A0,#5E8A6B,#2F5B3F
            dist/snake-dark.svg?color_snake=#FAF7F0&color_dots=#161B22,#243029,#3D5A47,#6E9178,#9BB8A0

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
